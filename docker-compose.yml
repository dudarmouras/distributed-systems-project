services:
  # ── Broker MQTT (Mosquitto) ────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # ── Agente Coletor Node.js ─────────────────────────────────────────────────
  collector:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PROBE_TIMEOUT_MS=15000 # Após esse tempo sem heartbeat, o probe é marcado como DOWN
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    volumes:
      - collector-data:/app/data # Persiste o snapshot do estado (probes + eventos) em disco
    restart: unless-stopped
    depends_on:
      - mosquitto # O Node.js agora espera o MQTT subir primeiro

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus # Persiste o histórico de séries temporais (TSDB)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped
    depends_on:
      - collector

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana-data:
  prometheus-data:
  collector-data: